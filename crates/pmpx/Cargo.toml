[package]
name = "pmpx"
# The description must not say which families are supported -- pluggable backends are the tool
# itself, so naming one would turn an example into a scope.
description = "Detects a project and routes package manager commands to the matching tool."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
rust-version.workspace = true
keywords = ["cli", "package-manager", "cargo", "npm", "pnpm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "pmpx"
path = "src/main.rs"

[dependencies]
# The contract crate (an in-workspace path dependency).
pmpx-plugin.workspace = true

# The host side of the ABI: negotiation, calling, and the typed context. The CLI itself never sees a
# pointer -- everything below that line is `pmpx-loader`'s business.
pmpx-loader.workspace = true

# The decision: which plugin a project belongs to, computed from data.
pmpx-detect.workspace = true

# pmpx's own configuration files (.pmpx.toml layers, the global file, atomic writes).
pmpx-project.workspace = true

# Executing what a plugin answers: resolution, spawning, exit codes, and the events of a run.
pmpx-engine.workspace = true

# General plugin management library: install / load / cross-process lock / cache. An
# external dependency, consumed by version.
crate-plugin-kit.workspace = true

clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"

# Colouring only. Both crates are already in the tree through clap's default `color` feature,
# so these direct declarations add no build work and no transitive dependency.
anstream = "1"
anstyle = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

# anyhow handles internal propagation; thiserror is used only on boundary types that must
# carry an exit code.
anyhow = "1"
thiserror = "2"

# Cross-platform paths. Do not hard-code ~/.config -- neither macOS nor Windows uses that
# location.
directories = "6"

# Resolve the backend's real path. On Windows `Command::new("pnpm")` fails, because
# CreateProcessW does not do PATHEXT resolution, and pnpm installs as `pnpm.cmd`.
which = "8"

# `pmpx self update` fetches a release over HTTPS, reads GitHub's JSON, and verifies the
# archive against SHA256SUMS. All three are already compiled into every pmpx binary --
# crate-plugin-kit uses ureq (and therefore rustls, which hashes with ring) to talk to
# crates.io, and serde_json to read `cargo metadata` -- so declaring them here makes what
# is already in the graph usable from this crate instead of adding to it.
ureq = "3"
serde_json = "1"
ring = "0.17"

# Reading the two archive shapes a release publishes. Both are used read-only and with
# everything switched off that this does not need: `tar` without xattr, `zip` without
# every codec except the deflate it shares with the flate2 already in the tree.
tar = { version = "0.4", default-features = false }
zip = { version = "5", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"

[dev-dependencies]
tempfile = "3"
# Integration tests use `find_library` to find the cdylib in the artifact directory
# according to platform rules.
crate-plugin-kit.workspace = true

# `cargo binstall` finds the release on its own -- `pmpx-{target}.{tar.gz,zip}` is one of
# the names it tries by default -- but our archives put the binary at their root, while
# binstall assumes it sits inside a directory named after the asset. So that is the one
# thing it has to be told. Everything else is deliberately left at binstall's defaults:
# the fewer templates, the fewer that can drift from `scripts/package-release.*`.
[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"
