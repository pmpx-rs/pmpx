[package]
name = "pmpx"
# The description must not say "which families are supported" -- pluggable backends are the
# tool itself. The cargo / pnpm in parentheses are **examples**, not a scope.
description = "One command surface for a project's package managers. Detects the project type, routes the verb, and spawns the real tool (cargo, pnpm, ...)."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
rust-version.workspace = true
keywords = ["cli", "package-manager", "cargo", "npm", "pnpm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "pmpx"
path = "src/main.rs"

[dependencies]
# The contract crate (an in-workspace path dependency).
pmpx-plugin.workspace = true

# General plugin management library: install / load / cross-process lock / cache. An
# external dependency, consumed by version.
crate-plugin-kit.workspace = true

clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
toml = "1"

# anyhow handles internal propagation; thiserror is used only on boundary types that must
# carry an exit code.
anyhow = "1"
thiserror = "2"

# Cross-platform paths. Do not hard-code ~/.config -- neither macOS nor Windows uses that
# location.
directories = "6"

# Resolve the backend's real path. On Windows `Command::new("pnpm")` fails, because
# CreateProcessW does not do PATHEXT resolution, and pnpm installs as `pnpm.cmd`.
which = "8"

[dev-dependencies]
tempfile = "3"
# Integration tests use `find_library` to find the cdylib in the artifact directory
# according to platform rules.
crate-plugin-kit.workspace = true
