[package]
name = "pmpx-plugin-fakepm"
version = "0.1.0"
edition = "2021"
publish = false

# Single-element workspace: it lives inside pmpx's directory tree but is not a member of it
# (the workspace only takes `crates/*`).
[workspace]

[lib]
name = "pmpx_plugin_fakepm"
crate-type = ["cdylib"]

[dependencies]
# tests/fixtures/fake-plugin/ → crates/pmpx-plugin/
pmpx-plugin = { path = "../../../../pmpx-plugin" }
