[package]
name = "pmpx-plugin-toy"
version = "0.1.0"
edition = "2021"
publish = false

# Single-element workspace: it lives inside the pmpx workspace's directory tree but is not a
# member of it (the workspace only takes `crates/*`). Without this table cargo reports
# "current package believes it's in a workspace when it's not".
[workspace]

# Must match the lib_stem derived by `KitConfig::new("pmpx")`:
#   crate_prefix = "pmpx-plugin-"  ->  "pmpx-plugin-toy" minus the prefix leaves "toy"
#   lib_stem_prefix = "pmpx_plugin_"  ->  "pmpx_plugin_toy"
[lib]
name = "pmpx_plugin_toy"
crate-type = ["cdylib"]

[dependencies]
# Path dependency back to the contract crate under test. `tests/fixtures/toy-plugin/` -> `crates/pmpx-plugin/`
pmpx-plugin = { path = "../../.." }
