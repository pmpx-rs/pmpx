[package]
name = "pmpx-plugin-toy"
version = "0.1.0"
edition = "2021"
publish = false

# 单元素 workspace：它住在 pmpx 工作区的目录树里，但**不是**它的成员
# （工作区只收 `crates/*`）。没有这张表，cargo 会报
# "current package believes it's in a workspace when it's not"。
[workspace]

# 必须与 `KitConfig::new("pmpx")` 推导出的 lib_stem 一致：
#   crate_prefix = "pmpx-plugin-"  →  "pmpx-plugin-toy" 去掉前缀剩 "toy"
#   lib_stem_prefix = "pmpx_plugin_"  →  "pmpx_plugin_toy"
[lib]
name = "pmpx_plugin_toy"
crate-type = ["cdylib"]

[dependencies]
# 路径依赖，指回被测的契约 crate。`tests/fixtures/toy-plugin/` → `crates/pmpx-plugin/`
pmpx-plugin = { path = "../../.." }
