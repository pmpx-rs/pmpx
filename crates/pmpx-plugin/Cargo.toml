[package]
name = "pmpx-plugin"
description = "Plugin contract for pmpx: the PackageManager trait and the stable C ABI that carries it across dlopen."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
# 不继承工作区地板（1.88）：这个 crate 零依赖，只需要 1.82
# （`#[unsafe(no_mangle)]` 的最低版本）。这一栏决定了谁能写插件，
# 不该被同工作区里另一个 crate 的依赖拖高。
rust-version = "1.82"
keywords = ["plugin", "abi", "cdylib", "ffi"]
categories = ["development-tools"]

# 零依赖，刻意的：这个 crate 会被 pmpx 和每一个插件依赖，
# 它多一个依赖所有人就多一个，MSRV 抬高一次能写插件的人就少一批。
# 跨边界只有 `#[repr(C)]` 数据，也确实用不上别的。
[dependencies]

[build-dependencies]
# 无依赖：build.rs 只起一次 `rustc --version`，把结果写进环境变量。

[dev-dependencies]
# 走真实的加载链路：用宿主真正会用的那个库去 dlopen 一个真 cdylib。
# 手写 libloading 的话就得把入口符号名和库文件名硬编码一遍，
# 而那正是最该被测试发现"对不上"的两个名字。
crate-plugin-kit.workspace = true
tempfile = "3"
