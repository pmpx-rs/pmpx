[package]
name = "pmpx-plugin"
description = "Defines the pmpx plugin contract and the C ABI that carries it across dlopen."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
# Does not inherit the workspace floor (1.88): this crate has zero dependencies and needs
# only 1.82 (the minimum for `#[unsafe(no_mangle)]`). This field decides who can write
# plugins, and must not be dragged up by another crate's dependencies in the same workspace.
rust-version = "1.82"
keywords = ["plugin", "abi", "cdylib", "ffi"]
categories = ["development-tools"]

# Zero dependencies, deliberately: both pmpx and every plugin depend on this crate, so one
# more dependency for it is one more for everyone, and raising its MSRV once means fewer
# people can write plugins. Only `#[repr(C)]` data crosses the boundary, so nothing else is
# needed anyway.
[dependencies]

[build-dependencies]
# No dependencies: build.rs just runs `rustc --version` once and writes the result into an
# environment variable.

[dev-dependencies]
# Goes through the real load path: dlopen an actual cdylib using the very library the host
# will use. Hand-rolling libloading would mean hard-coding both the entry symbol name and the
# library file name, and those are exactly the two names a test should catch being out of
# sync.
crate-plugin-kit.workspace = true
tempfile = "3"
