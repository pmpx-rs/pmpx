[package]
name = "pmpx-engine"
description = "Runs what a plugin answers: resolving the program, starting it, and reporting what happened."
readme = "README.md"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
rust-version.workspace = true
keywords = ["cli", "pmpx", "process"]
categories = ["development-tools"]

# Executing a command is a PATH lookup and a `CreateProcess`: `which` is the part that has to be
# right on Windows (PATHEXT, `.cmd` shims), and it is a pure function of the environment.
[dependencies]
which = "8"

# The contract (verbs, reasons, `CommandSpec`) and the host side of the ABI (negotiation, calling, the
# typed context). This is the crate that talks to plugins, so it is the crate that names them.
pmpx-plugin.workspace = true
pmpx-loader.workspace = true

# Configuration tells the walk-up where to stop; the layout of the files is not this crate's business.
pmpx-project.workspace = true
# Which plugin a project belongs to: the decision, as data.
pmpx-detect.workspace = true
directories = "6"

# The store only: installing, listing and searching plugins. Optional, so an embedder that runs
# pre-installed plugins never links the HTTP stack the kit drags in.
crate-plugin-kit = { workspace = true, optional = true }
anyhow = { version = "1", optional = true }
# Manifests are read by the kit, host sections included -- nothing here parses TOML.

[features]
default = []
# What the CLI turns on. The engine itself is happy without it.
store = ["dep:crate-plugin-kit", "dep:anyhow"]

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = "warn"