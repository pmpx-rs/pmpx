name: Release

# Publishing is irreversible: once a crate name + version is out it can never be reused,
# and yanking does not take it back. So the choice here is to **refuse** rather than to
# guess, and a failed run can be safely re-run -- "this version is already on the registry"
# counts as done, not as an error.
#
# The checks live in ci.yaml and are called from here, so the order is structural (a
# `needs` within the same run) rather than something lined up by timing two workflows. The
# release archives are delegated the same way, to assets.yaml.
#
# One tag produces both halves of a release: the crates.io publish, and the archives that
# `pmpx self update` and the install script consume. They share the same gate (`checks`)
# but not each other -- the note on the assets job says why.

on:
  push:
    # The only trigger. Nothing else can start a run, so nothing else can touch the registry.
    tags: [ "v*.*.*" ]

# Read-only by default; the job that attaches files to the release asks for more.
permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yaml

  publish:
    name: Publish to crates.io
    needs: [ checks ]
    runs-on: ubuntu-latest
    # No `environment:` declared: that would move the secret into an environment scope and
    # require it to exist before the first run. The token is read straight from the
    # repository's Secrets; add this back when manual approval is wanted.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # No rust-cache: this job has no dependencies worth caching, and the `cargo publish`
      # verification takes seconds.
      - name: Install the release tool
        run: cargo install harbor --version 0.1.3 --locked

      # One command checks three things: the tag name matches the manifest version, the
      # registry token exists and is non-empty, and the publish plan can be computed.
      # Nothing is uploaded until all three hold.
      #
      # The token goes through the environment only, never as a command-line argument --
      # cargo echoes the command line, which would put it in the logs.
      - name: Check the release before starting it
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo harbor check --plan "$GITHUB_REF_NAME"

      # The publish order is computed from the dependency graph by `check --plan`, not
      # written by hand here -- a hand-written order goes stale, and the moment it does the
      # registry is already half written. harbor publish publishes one by one according to
      # the plan, retries while a dependency is not yet in the index, treats "version is
      # already on the registry" as done (so a re-run finishes a half-failed publish), and
      # stops immediately on any other error.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo harbor publish

  # ---------------------------------------------------------------------------
  # The release archives and `SHA256SUMS` -- see assets.yaml, which owns that pipeline.
  #
  # Called from here rather than triggered by its own `on: push: tags`, so it cannot run
  # before `checks` has passed: "an artifact never lands on a tag whose checks failed" is
  # then structural, not a matter of which workflow happened to start first.
  #
  # Unlike the crates.io publish it does **not** wait for the registry: nothing in the
  # download path needs it, and a registry outage should not stop a binary release. Both
  # halves are gated on `checks`, which is the real gate.
  #
  # assets.yaml also takes `workflow_dispatch`, so the four runners -- which only exist on
  # GitHub -- can be exercised against an existing tag instead of at the next release.
  # ---------------------------------------------------------------------------
  assets:
    name: Archives
    needs: [ checks ]
    uses: ./.github/workflows/assets.yaml
    permissions:
      # The called workflow can only narrow this; it needs to write to the release.
      contents: write
