name: Checks

# The checks a release must pass first. This file has **no trigger of its own**: the
# only way to run it is for release.yaml to call it.
#
# That is what makes "no release unless the checks pass" a **structural** guarantee
# rather than something lined up by timing.
on:
  workflow_call:

permissions:
  contents: read

# A workflow's own `env` is **not** passed to the workflow it calls, so declare it again here.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    # This workspace does things **across dynamic library boundaries**: `dlopen`/`dlsym`,
    # platform-specific library file names, and behavior such as "a panic must not cross
    # the extern "C" boundary" are not identical on the three platforms (where Abort/Unwind
    # lands, default symbol visibility). So all three platforms run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # This repository deliberately has no `rust-toolchain.toml`: a pinned channel would
      # override the `cargo +<msrv>` of the msrv job below, and `rust-version` is the
      # promise, honored by that job.
      - name: Install stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Includes the two integration tests: `shim.rs` drives the generated shim directly
      # through the ABI; `cdylib.rs` actually builds a cdylib and then loads it with
      # crate-plugin-kit.
      - name: Test
        run: cargo test --locked

      # The engine's store is behind a feature the workspace's default build does not turn on, so
      # its tests are not compiled by the step above -- and a bug in the store would ship without
      # this ever going red. Which is not hypothetical: the `-C` path normalization was wrong for
      # exactly as long as nothing compiled these tests here.
      - name: Test the engine with its store feature
        run: cargo test -p pmpx-engine --features store --locked

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      # The release scripts are what a tag runs. A syntax error in one of them would first
      # show up while publishing, which is the worst moment to find it -- so both are
      # parsed here. Both shells exist on the Linux runner, so one step covers both.
      - name: The release scripts parse
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/package-release.sh
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw scripts/package-release.ps1))'
          echo "both packaging scripts parse"

      # `pmpx-plugin` and `pmpx-plugin-abi` promise **zero dependencies**. This is the most
      # important promise to this ecosystem: one more dependency for them is one more for every
      # plugin author; raise their MSRV once and fewer people can write plugins.
      #
      # Without this gate, it is just a comment in Cargo.toml -- and "let me just pull in
      # once_cell" would go unnoticed.
      #
      # Only normal edges count: dev-dependencies (crate-plugin-kit, used by integration
      # tests) and build-dependencies **do not exist for plugin authors**, so they must not
      # count against this promise.
      - name: the contract crates must stay dependency-free
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for crate in pmpx-plugin pmpx-plugin-abi pmpx-detect; do
            deps=$(cargo tree -p "$crate" -e normal --prefix none 2>/dev/null \
              | awk '{print $1}' | sort -u | grep -vx "$crate" || true)
            if [ -n "$deps" ]; then
              echo "::error::$crate promises zero dependencies, but the normal dependency tree contains:"
              echo "$deps"
              exit 1
            fi
            echo "$crate has zero normal dependencies"
          done

      # `unsafe` is a promise about *where* the raw pointers live, not a style preference. The ABI
      # layer is where they belong; the plugin shell, the host's two C callbacks and its one load
      # call are the only other places allowed to spell the word, and each of them is a boundary the
      # contract names. Anywhere else it means a safe abstraction leaked.
      - name: unsafe stays in the ABI islands
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Only real code counts: a line whose `unsafe` sits behind a `//` is prose (several module
          # docs here explain what `unsafe` is for).
          allowed='^(crates/pmpx-plugin-abi/|crates/pmpx-loader/|crates/pmpx-plugin/src/(shell|export|debug|context)[.]rs|crates/pmpx-engine/src/(backend|log)[.]rs)'
          offenders=$(grep -rl --include='*.rs' -E '^[^/]*\bunsafe\b' crates \
            | grep -Ev "$allowed" \
            | grep -Ev '(/fixtures/|/tests/|tests[.]rs$)' || true)
          if [ -n "$offenders" ]; then
            echo "::error::unsafe outside the ABI islands:"
            echo "$offenders"
            exit 1
          fi
          echo "unsafe appears only in the ABI layer, the plugin shell (including the typed context), and the engine's two ABI files"

      # "Zero async runtime in the whole stack" is a promise written down in the README.
      # Without this gate it is just a sentence -- if some dependency casually drags tokio
      # in, nobody would notice.
      #
      # Passing a `Future` across the `dlopen` boundary is the most fragile spot in this
      # scheme, and the whole design rests on "only POD crosses the boundary". That promise
      # deserves a gate.
      - name: No async runtime anywhere
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          names=$(cargo tree --workspace --prefix none 2>/dev/null | awk '{print $1}' | sort -u)
          offenders=$(printf '%s\n' "$names" \
            | grep -xE 'tokio|async-std|smol|async-io|async-executor|async-global-executor' \
            || true)
          if [ -n "$offenders" ]; then
            echo "::error::this workspace promises zero async runtime, but the dependency tree contains:"
            echo "$offenders"
            exit 1
          fi
          echo "no async runtime anywhere in the dependency tree"

      # Package each crate individually -- `cargo package` is what publishing actually does,
      # and it catches problems only the publish path exposes, such as a missing `version`
      # or an unpublished dependency.
      #
      # `pmpx-plugin` and `pmpx-plugin-abi` have no registry dependencies, so both can be fully
      # packaged + compiled.
      #
      # `pmpx` cannot: it depends on the **published version** of `pmpx-plugin` (when
      # packaging, cargo strips `path` and keeps only the version number). Right after a
      # version bump, while that version is not yet on the registry, full packaging
      # **necessarily fails** -- that is a matter of publish order, not of this commit, and
      # the order is computed from the dependency graph by `harbor check --plan` in the
      # release workflow. Forcing it to pass here would block the release.
      #
      # So `pmpx` only checks file assembly (`--list` does not resolve the registry). The
      # "dependency declares only path, no version" case it used to catch incidentally is
      # covered by the static check below, which needs no registry.
      - name: Package
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/package-target
        run: |
          set -euo pipefail
          cargo package -p pmpx-plugin-abi --locked
          cargo package -p pmpx-plugin --locked
          # `--list` only: `pmpx-loader` depends on `pmpx-plugin-abi` by path (not published yet), so
          # full packaging would wait on a registry. The same reason `pmpx` is checked this way.
          cargo package -p pmpx-loader --list
          cargo package -p pmpx --list

      # The ABI's two renderings are generated from the Rust definitions and committed, so that a
      # change to the wire format cannot happen quietly: the snapshot has to be updated (and
      # reviewed) in the same commit, and the C header has to agree with it.
      #
      # The header additionally carries `_Static_assert`s for every struct's size and every
      # field's offset, so compiling it is what proves a C plugin and a Rust plugin read the same
      # layout.
      - name: The generated ABI files must be current
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo run -p pmpx-plugin-abi --example gen-abi-files -- --check

          cat > "$RUNNER_TEMP/abi-header.c" <<'EOF'
          #include "pmpx_plugin.h"

          int main(void) {
              PmpxCommand command = { 0 };
              command.size = sizeof(PmpxCommand);
              return (int)(command.size == 0);
          }
          EOF

          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -I crates/pmpx-plugin-abi/include "$RUNNER_TEMP/abi-header.c"
          echo "the C header compiles and its layout assertions hold"

      # Workspace-internal dependencies must declare **both** `path` and `version`. With
      # only path it builds locally, but at publish time that dependency resolves to the
      # version on the registry and package verification necessarily fails.
      - name: Workspace deps declare a version
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          missing=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].dependencies[] | select(.path != null and .req == "*") | .name')
          if [ -n "$missing" ]; then
            echo "::error::these workspace-internal dependencies declare only path, no version:"
            echo "$missing"
            exit 1
          fi
          echo "all workspace-internal dependencies declare a version"

  # ---------------------------------------------------------------------------
  # MSRV.
  #
  # `pmpx-plugin` is what **plugin authors** depend on, and its MSRV decides who can write
  # plugins. It currently says 1.82 (the minimum for `#[unsafe(no_mangle)]` -- the form the
  # macro must use, because `#[no_mangle]` is a hard error in edition 2024).
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version from the contract crate
        id: msrv
        run: |
          set -euo pipefail
          version=$(python3 -c '
          import tomllib
          with open("crates/pmpx-plugin/Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["rust-version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"

      - name: Install MSRV toolchain
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
          rustup default "${{ steps.msrv.outputs.version }}"

      # Deliberately **not** running `cargo build --all-targets` here.
      #
      # pmpx-plugin's dev-dependencies (crate-plugin-kit, used by integration tests)
      # themselves require 1.85+, and dev-dependencies **do not exist for plugin authors at
      # all**. Running an all-targets build here would test "can this repository's test
      # suite run on the MSRV", not what the MSRV actually promises.
      #
      # What should be verified is: **can a plugin author on 1.82 build their plugin.**
      # So build a crate like theirs -- placed **outside** the workspace, so it cannot see
      # those dev-dependencies.
      - name: Build a minimal consumer on the MSRV
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/msrv-probe"
          mkdir -p "$probe/src"

          cat > "$probe/Cargo.toml" <<EOF
          [package]
          name    = "msrv-probe"
          version = "0.0.0"
          edition = "2021"

          # single-member workspace: isolated so it cannot see pmpx-plugin's dev-dependencies
          [workspace]

          [lib]
          crate-type = ["cdylib"]

          [dependencies]
          pmpx-plugin = { path = "$GITHUB_WORKSPACE/crates/pmpx-plugin" }
          EOF

          cat > "$probe/src/lib.rs" <<'EOF'
          use std::ffi::OsString;
          use pmpx_plugin::{CommandSpec, Context, Family, PackageManager, PluginError, Verb};

          pub struct Probe;

          impl PackageManager for Probe {
              fn name(&self) -> &str { "probe" }
              fn family(&self) -> Family { Family::RUST }
              fn command(&self, _ctx: &Context, _verb: Verb, _args: &[OsString])
                  -> Result<CommandSpec, PluginError> {
                  Ok(CommandSpec::new("probe"))
              }
          }

          pub fn create() -> Box<dyn PackageManager> { Box::new(Probe) }
          pmpx_plugin::export!(create);
          EOF

          # cdylib rather than a plain lib: `#[unsafe(no_mangle)]` and the exported symbols
          # must really go through linking.
          cargo build --manifest-path "$probe/Cargo.toml" --release
          ls -la "$probe/target/release" | grep -E 'probe' || true

  # ---------------------------------------------------------------------------
  # Cross-toolchain.
  #
  # "The host and the plugin do not need the same rustc" is the **entire reason** for
  # choosing a C ABI instead of a Rust trait. Without this job it is just a sentence in the
  # docs -- and it happens to be the foundation most worth stressing in the whole scheme.
  #
  # The method: build the plugin with the contract crate's MSRV, build the host (and all its
  # dependencies) with stable, and let the stable host dlopen the cdylib produced by the
  # older toolchain. The gap between the two ends is as wide as it gets.
  # ---------------------------------------------------------------------------
  cross-toolchain:
    name: Cross-toolchain load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the contract crate's MSRV
        id: msrv
        run: |
          set -euo pipefail
          version=$(python3 -c '
          import tomllib
          with open("crates/pmpx-plugin/Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["rust-version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install both toolchains
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
          rustup default stable
          echo "host   : $(cargo --version)"
          echo "plugin : $(cargo +${{ steps.msrv.outputs.version }} --version)"

      # The plugin side depends only on pmpx-plugin (zero dependencies), so the old
      # toolchain can build it.
      - name: Build the plugin with the MSRV toolchain
        run: |
          set -euo pipefail
          cargo "+${{ steps.msrv.outputs.version }}" build --release \
            --manifest-path crates/pmpx-plugin/tests/fixtures/toy-plugin/Cargo.toml \
            --target-dir "$RUNNER_TEMP/plugin-target"
          ls -la "$RUNNER_TEMP/plugin-target/release" | grep pmpx_plugin_toy

      # `PMPX_TEST_PREBUILT_LIB` makes the cdylib e2e test skip compilation and use the
      # ready-made artifact directly. So the same assertions run against objects produced by
      # **two different rustcs**.
      #
      # This job only runs on ubuntu, so the .so path can be hard-coded.
      - name: Drive it from a stable-built host
        env:
          PMPX_TEST_PREBUILT_LIB: ${{ runner.temp }}/plugin-target/release/libpmpx_plugin_toy.so
        run: cargo test --locked --test cdylib

      - name: Record what was actually verified
        run: |
          set -euo pipefail
          echo "plugin built by : $(cargo +${{ steps.msrv.outputs.version }} --version)"
          echo "host built by   : $(cargo --version)"
          echo "→ a cdylib built with ${{ steps.msrv.outputs.version }} was loaded by a stable-built host,"
          echo "  called across the boundary, and had a panic safely contained."
