name: Assets

# The archives a release ships, plus the checksum file that lets a downloader prove they
# are the bytes that were built.
#
#   pmpx-<target>.tar.gz   (Unix)     -> pmpx + LICENSE, both at the top level
#   pmpx-<target>.zip      (Windows)  -> pmpx.exe + LICENSE
#   SHA256SUMS
#
# Both the names and the layout are interfaces: `pmpx self update` and the install script
# build their URLs from them and pick the binary out of the archive by name.
#
# It is a **reusable workflow** rather than a second `on: push: tags` workflow on purpose.
# Being called from release.yaml means it runs only after `checks` has passed, so "never
# attach an artifact to a tag whose checks failed" is structural instead of a matter of
# timing two independent runs.
#
# There is deliberately no `workflow_dispatch`, for the same reason the registry path has no
# second trigger: the tag is the only way in, so a release's assets can only ever be the ones
# its own tag produced. A failed run is re-run from the Actions page, which keeps the same
# tag -- that is the recovery path, and it cannot attach assets to a tag that was never
# pushed.

on:
  # Called from release.yaml, which a `v<major>.<minor>.<patch>` tag starts. Nothing else can
  # start this; the tag travels in as the ref the caller runs on.
  workflow_call:

permissions:
  contents: read

jobs:
  archives:
    name: Archive (${{ matrix.target }})
    strategy:
      fail-fast: false
      # One runner per target: an archive is only usable by a machine of that triple, and
      # the triple is part of the name. Adding one is two lines.
      #   macos-13 is retired; macos-15-intel is its replacement, and plain macos-15 is the
      #   Apple silicon image.
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      # Granted by the caller as well: a called workflow can only narrow permissions.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # On a manual run the workflow is running against a branch, so the archive has
          # to be built from the tag that was named -- otherwise the bytes of main would
          # land on an old release.
          ref: ${{ github.ref_name }}

      # `shell: bash` on every runner: it exists on all three, and it keeps this step from
      # being one script on Linux and another on Windows.
      - name: Install stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # The same script a maintainer runs locally, so a release can be reproduced without
      # going through CI at all.
      - name: Build the archive
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -NoProfile -File scripts/package-release.ps1 -Target ${{ matrix.target }}
          else
            bash scripts/package-release.sh ${{ matrix.target }}
          fi

      # The release object is created here. Every matrix leg tries, so "already exists"
      # and losing that race are not failures; only the upload has to succeed.
      - name: Upload it to the tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --notes "Release $tag" \
            || true
          gh release upload "$tag" dist/* --clobber
          echo "assets now on the release:"
          gh release view "$tag" --json assets --jq '.assets[].name'

  # ---------------------------------------------------------------------------
  # SHA256SUMS.
  #
  # The one file `self update` insists on before it touches a running binary, so it is
  # built here rather than by each runner: every target's archive has to be listed in one
  # file, whatever machine produced it.
  # ---------------------------------------------------------------------------
  checksums:
    name: SHA256SUMS
    needs: [ archives ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # `gh` works out which repository it is talking to from the git remote, and this job has
    # no checkout on purpose (nothing here reads the source), so the repository is named in
    # the environment instead. Without this, `gh release download` fails with
    # "fatal: not a git repository".
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # `gh` has to be told which repository it is working on, and it has two ways of being
      # told: `GH_REPO` (set on the job above) and the git remote a checkout leaves behind.
      # Both are here on purpose -- this job is the only place a release is written to
      # without a checkout, the failure it caused ("fatal: not a git repository") is
      # invisible until the tag is already out, and a second failed run costs another tag.
      - uses: actions/checkout@v7

      - name: Hash every archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          mkdir -p dist
          cd dist
          gh release download "$tag" --pattern 'pmpx-*' --clobber

          # Bare asset names, so `sha256sum -c SHA256SUMS` works in the directory someone
          # has just downloaded into.
          sha256sum pmpx-* > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Upload it
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS --clobber

      # `gh release upload` returns non-zero on failure, so a transient error here already
      # fails the job. What it does NOT catch is a missing asset: the upload can succeed
      # and the asset can then silently disappear (race with another runner, the release
      # being recreated by a re-run, etc.). One last query, before the job claims success,
      # makes "SHA256SUMS is on the tag" a structural fact rather than a hopeful one --
      # without it, every install script on every machine throws a 404 that blames the
      # archive instead of the checksum file.
      - name: Confirm SHA256SUMS is on the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          gh release view "$tag" --json assets --jq '.assets[].name' \
            | grep -Fxq SHA256SUMS \
            || { echo "::error::SHA256SUMS is not on release $tag; the download path cannot verify against it." >&2; exit 1; }
