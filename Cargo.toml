[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version    = "0.3.0"
edition    = "2021"
license    = "MIT"
repository = "https://github.com/pmpx-rs/pmpx"
# The workspace floor is 1.88 (`pmpx` depends on crate-plugin-kit, which needs 1.88).
# `pmpx-plugin` does not inherit it -- that crate declares 1.82 itself, because its MSRV
# decides who can write plugins.
rust-version = "1.88"

[workspace.dependencies]
# Both path and version: at publish time the path is stripped and only the version remains,
# so version is mandatory, and it must match [workspace.package] version exactly.
pmpx-plugin = { path = "crates/pmpx-plugin", version = "0.3.0" }

# The raw ABI layer: `#[repr(C)]` data, keys and capabilities. Shared by the plugin shell, the host
# loader and (later) the plugin-author test kit. `features = ["std"]` is added where it is wanted,
# so the crate's own default stays `no_std`.
pmpx-plugin-abi = { path = "crates/pmpx-plugin-abi", version = "0.3.0" }

# The host side of the ABI: negotiation, calling, and the typed context. This is the only place the
# two sides meet, so the CLI itself never sees a pointer.
pmpx-loader = { path = "crates/pmpx-loader", version = "0.3.0" }

# The decision: scoring and resolution, on data. Zero dependencies, no filesystem, no printing.
pmpx-detect = { path = "crates/pmpx-detect", version = "0.3.0" }

# pmpx's own configuration files: reading, layering, writing.
pmpx-project = { path = "crates/pmpx-project", version = "0.3.0" }

# Executing what a plugin answers: resolution, spawning, exit codes, and the events of a run.
pmpx-engine = { path = "crates/pmpx-engine", version = "0.3.0" }

# What a plugin author's tests need: a context, a fixture directory, and a fake host.
pmpx-testkit = { path = "crates/pmpx-testkit", version = "0.3.0" }

# General plugin management library. An external dependency, consumed by version, not by path.
crate-plugin-kit = "0.3.0"

[profile.release]
# Everything favors fast runtime; slow builds are fine.
lto           = "fat"
codegen-units = 1
opt-level     = 3
strip         = "symbols"
# panic = "abort" is not an option: a plugin's panic must be catchable by catch_unwind.
panic         = "unwind"
